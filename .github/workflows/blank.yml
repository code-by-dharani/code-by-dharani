```yaml
name: Generate GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p profile

          python3 <<'PY'
          import os
          import json
          import urllib.request

          username = "code-by-dharani"
          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "github-profile-stats"
          }

          def get(url):
              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read())

          # -----------------------------
          # USER INFORMATION
          # -----------------------------

          user = get(
              f"https://api.github.com/users/{username}"
          )

          # -----------------------------
          # REPOSITORIES
          # -----------------------------

          repos = []
          page = 1

          while True:
              data = get(
                  f"https://api.github.com/users/{username}/repos"
                  f"?per_page=100&page={page}"
              )

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1

          stars = sum(
              repo["stargazers_count"]
              for repo in repos
          )

          forks = sum(
              repo["forks_count"]
              for repo in repos
          )

          # -----------------------------
          # CONTRIBUTIONS
          # -----------------------------

          query = """
          query($login:String!) {
            user(login:$login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """

          body = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=body,
              headers={
                  **headers,
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read())

          calendar = (
              result["data"]
              ["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          contributions = calendar["totalContributions"]

          days = []

          for week in calendar["weeks"]:
              days.extend(
                  week["contributionDays"]
              )

          days.sort(
              key=lambda x: x["date"]
          )

          # -----------------------------
          # STREAK
          # -----------------------------

          current_streak = 0

          for day in reversed(days):
              if day["contributionCount"] > 0:
                  current_streak += 1
              else:
                  break

          longest_streak = 0
          running = 0

          for day in days:
              if day["contributionCount"] > 0:
                  running += 1
                  longest_streak = max(
                      longest_streak,
                      running
                  )
              else:
                  running = 0

          # -----------------------------
          # SVG START
          # -----------------------------

          def start(height):
              return f'''<svg xmlns="http://www.w3.org/2000/svg"
              width="900"
              height="{height}"
              viewBox="0 0 900 {height}">

              <rect width="900"
                    height="{height}"
                    rx="16"
                    fill="#0d1117"/>

              <style>
                .title {{
                  font-family: Arial;
                  font-size: 25px;
                  font-weight: bold;
                  fill: #70a5fd;
                }}

                .number {{
                  font-family: Arial;
                  font-size: 30px;
                  font-weight: bold;
                  fill: #ffffff;
                }}

                .small {{
                  font-family: Arial;
                  font-size: 13px;
                  fill: #8b949e;
                }}
              </style>
              '''

          # -----------------------------
          # GITHUB STATS
          # -----------------------------

          svg = start(350)

          svg += f'''
          <text x="40" y="55" class="title">
            GitHub Statistics
          </text>

          <text x="60" y="125" class="number">
            {user["public_repos"]}
          </text>

          <text x="60" y="155" class="small">
            Public Repositories
          </text>

          <text x="280" y="125" class="number">
            {user["followers"]}
          </text>

          <text x="280" y="155" class="small">
            Followers
          </text>

          <text x="500" y="125" class="number">
            {stars}
          </text>

          <text x="500" y="155" class="small">
            Repository Stars
          </text>

          <text x="700" y="125" class="number">
            {forks}
          </text>

          <text x="700" y="155" class="small">
            Forks
          </text>

          <text x="60" y="235" class="number">
            {contributions}
          </text>

          <text x="60" y="265" class="small">
            Contributions
          </text>

          <text x="60" y="315" class="small">
            Updated automatically by GitHub Actions
          </text>

          </svg>
          '''

          with open("profile/stats.svg", "w") as f:
              f.write(svg)

          # -----------------------------
          # STREAK
          # -----------------------------

          svg = start(300)

          svg += f'''
          <text x="40" y="55" class="title">
            Contribution Streak
          </text>

          <text x="100" y="140" class="number">
            {current_streak}
          </text>

          <text x="100" y="170" class="small">
            Current Streak
          </text>

          <text x="390" y="140" class="number">
            {longest_streak}
          </text>

          <text x="390" y="170" class="small">
            Longest Streak
          </text>

          <text x="680" y="140" class="number">
            {contributions}
          </text>

          <text x="680" y="170" class="small">
            Contributions
          </text>

          </svg>
          '''

          with open("profile/streak.svg", "w") as f:
              f.write(svg)

          # -----------------------------
          # ACTIVITY
          # -----------------------------

          recent = days[-30:]

          maximum = max(
              [d["contributionCount"] for d in recent] or [1]
          )

          svg = start(350)

          svg += '''
          <text x="40" y="55" class="title">
            GitHub Activity
          </text>
          '''

          x = 40

          for day in recent:

              count = day["contributionCount"]

              height = int(
                  (count / maximum) * 180
              )

              y = 280 - height

              svg += f'''
              <rect x="{x}"
                    y="{y}"
                    width="20"
                    height="{height}"
                    rx="4"
                    fill="#70a5fd"/>
              '''

              x += 28

          svg += '''
          <text x="40" y="320" class="small">
            Contribution activity — last 30 days
          </text>

          </svg>
          '''

          with open("profile/activity.svg", "w") as f:
              f.write(svg)

          # -----------------------------
          # HIGHLIGHTS
          # -----------------------------

          svg = start(330)

          svg += '''
          <text x="40" y="55" class="title">
            GitHub Highlights
          </text>
          '''

          items = [
              ("Repositories", user["public_repos"]),
              ("Followers", user["followers"]),
              ("Stars", stars),
              ("Forks", forks),
              ("Contributions", contributions)
          ]

          positions = [
              40, 210, 380, 550, 720
          ]

          for (name, value), x in zip(
              items,
              positions
          ):

              svg += f'''
              <rect x="{x}"
                    y="100"
                    width="140"
                    height="130"
                    rx="14"
                    fill="#161b22"
                    stroke="#30363d"/>

              <text x="{x + 70}"
                    y="155"
                    text-anchor="middle"
                    class="number">
                {value}
              </text>

              <text x="{x + 70}"
                    y="185"
                    text-anchor="middle"
                    class="small">
                {name}
              </text>
              '''

          svg += '</svg>'

          with open("profile/trophies.svg", "w") as f:
              f.write(svg)

          print("Profile statistics generated successfully.")

          PY

      - name: Save generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub profile statistics"
            git push
          fi
```
