name: Generate Profile SVGs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      - name: Generate SVG files
        run: |
          cat > profile/stats.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="900" height="300">
            <rect width="900" height="300" rx="20" fill="#0d1117"/>
            <text x="40" y="55" font-family="Arial" font-size="28" font-weight="bold" fill="#70a5fd">📊 GitHub Statistics</text>
            <text x="80" y="130" font-family="Arial" font-size="32" font-weight="bold" fill="white">GitHub Profile</text>
            <text x="80" y="170" font-family="Arial" font-size="18" fill="#8b949e">code-by-dharani</text>
            <text x="80" y="225" font-family="Arial" font-size="16" fill="#c9d1d9">M.Tech CSE • Frontend Developer • Python Developer</text>
          </svg>
          EOF

          cat > profile/streak.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="900" height="260">
            <rect width="900" height="260" rx="20" fill="#0d1117"/>
            <text x="40" y="55" font-family="Arial" font-size="28" font-weight="bold" fill="#70a5fd">🔥 Contribution Streak</text>
            <text x="100" y="130" font-family="Arial" font-size="32" font-weight="bold" fill="white">Keep Coding!</text>
            <text x="100" y="175" font-family="Arial" font-size="18" fill="#8b949e">Build • Commit • Learn • Repeat</text>
          </svg>
          EOF

          cat > profile/activity.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="900" height="300">
            <rect width="900" height="300" rx="20" fill="#0d1117"/>
            <text x="40" y="55" font-family="Arial" font-size="28" font-weight="bold" fill="#70a5fd">📈 GitHub Activity</text>

            <rect x="80" y="120" width="30" height="80" rx="5" fill="#70a5fd"/>
            <rect x="130" y="145" width="30" height="55" rx="5" fill="#70a5fd"/>
            <rect x="180" y="105" width="30" height="95" rx="5" fill="#70a5fd"/>
            <rect x="230" y="160" width="30" height="40" rx="5" fill="#70a5fd"/>
            <rect x="280" y="125" width="30" height="75" rx="5" fill="#70a5fd"/>
            <rect x="330" y="90" width="30" height="110" rx="5" fill="#70a5fd"/>
            <rect x="380" y="140" width="30" height="60" rx="5" fill="#70a5fd"/>
            <rect x="430" y="115" width="30" height="85" rx="5" fill="#70a5fd"/>
            <rect x="480" y="155" width="30" height="45" rx="5" fill="#70a5fd"/>
            <rect x="530" y="100" width="30" height="100" rx="5" fill="#70a5fd"/>

            <text x="80" y="235" font-family="Arial" font-size="16" fill="#8b949e">Recent GitHub Activity</text>
          </svg>
          EOF

          cat > profile/trophies.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="900" height="300">
            <rect width="900" height="300" rx="20" fill="#0d1117"/>
            <text x="40" y="55" font-family="Arial" font-size="28" font-weight="bold" fill="#70a5fd">🏆 GitHub Highlights</text>

            <rect x="70" y="100" width="150" height="120" rx="15" fill="#161b22"/>
            <text x="145" y="155" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="white">🚀</text>
            <text x="145" y="190" text-anchor="middle" font-family="Arial" font-size="15" fill="#8b949e">Projects</text>

            <rect x="270" y="100" width="150" height="120" rx="15" fill="#161b22"/>
            <text x="345" y="155" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="white">💻</text>
            <text x="345" y="190" text-anchor="middle" font-family="Arial" font-size="15" fill="#8b949e">Coding</text>

            <rect x="470" y="100" width="150" height="120" rx="15" fill="#161b22"/>
            <text x="545" y="155" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="white">🤖</text>
            <text x="545" y="190" text-anchor="middle" font-family="Arial" font-size="15" fill="#8b949e">AI</text>

            <rect x="670" y="100" width="150" height="120" rx="15" fill="#161b22"/>
            <text x="745" y="155" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="white">🌐</text>
            <text x="745" y="190" text-anchor="middle" font-family="Arial" font-size="15" fill="#8b949e">Web</text>
          </svg>
          EOF

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "Generate profile SVGs" || echo "No changes to commit"
          git push
