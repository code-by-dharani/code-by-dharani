```yaml
name: Generate Profile SVGs

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  svg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SVG files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p profile

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          USER = "code-by-dharani"
          TOKEN = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": "Bearer " + TOKEN,
              "Accept": "application/vnd.github+json",
              "User-Agent": "profile-generator"
          }

          def github(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # User information
          user = github(
              "https://api.github.com/users/" + USER
          )

          # Repositories
          repos = []
          page = 1

          while True:
              data = github(
                  "https://api.github.com/users/" +
                  USER +
                  "/repos?per_page=100&page=" +
                  str(page)
              )

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1

          stars = sum(
              r["stargazers_count"] for r in repos
          )

          forks = sum(
              r["forks_count"] for r in repos
          )

          repo_count = user["public_repos"]
          followers = user["followers"]

          # Common SVG
          def svg(title, content, height=320):
              return f'''<svg xmlns="http://www.w3.org/2000/svg"
              width="900"
              height="{height}"
              viewBox="0 0 900 {height}">

              <rect width="900" height="{height}"
                    rx="18" fill="#0d1117"/>

              <style>
              .title {{
                  font: bold 26px Arial;
                  fill: #70a5fd;
              }}
              .number {{
                  font: bold 32px Arial;
                  fill: #ffffff;
              }}
              .label {{
                  font: 15px Arial;
                  fill: #8b949e;
              }}
              </style>

              <text x="40" y="55" class="title">
                  {title}
              </text>

              {content}

              </svg>'''

          # -----------------------------
          # STATS
          # -----------------------------

          content = f'''
          <text x="70" y="130" class="number">
              {repo_count}
          </text>
          <text x="70" y="160" class="label">
              Public Repositories
          </text>

          <text x="290" y="130" class="number">
              {followers}
          </text>
          <text x="290" y="160" class="label">
              Followers
          </text>

          <text x="510" y="130" class="number">
              {stars}
          </text>
          <text x="510" y="160" class="label">
              Repository Stars
          </text>

          <text x="730" y="130" class="number">
              {forks}
          </text>
          <text x="730" y="160" class="label">
              Forks
          </text>

          <text x="70" y="240" class="label">
              GitHub profile statistics
          </text>
          '''

          with open("profile/stats.svg", "w") as f:
              f.write(
                  svg(
                      "📊 GitHub Statistics",
                      content
                  )
              )

          # -----------------------------
          # STREAK
          # -----------------------------

          content = f'''
          <text x="100" y="135" class="number">
              {repo_count}
          </text>
          <text x="100" y="165" class="label">
              Repositories
          </text>

          <text x="400" y="135" class="number">
              {stars}
          </text>
          <text x="400" y="165" class="label">
              Stars
          </text>

          <text x="700" y="135" class="number">
              {followers}
          </text>
          <text x="700" y="165" class="label">
              Followers
          </text>

          <text x="100" y="230" class="label">
              GitHub activity overview
          </text>
          '''

          with open("profile/streak.svg", "w") as f:
              f.write(
                  svg(
                      "🔥 Contribution Overview",
                      content
                  )
              )

          # -----------------------------
          # ACTIVITY
          # -----------------------------

          content = f'''
          <text x="70" y="130" class="number">
              {repo_count}
          </text>
          <text x="70" y="160" class="label">
              Projects
          </text>

          <text x="300" y="130" class="number">
              {stars}
          </text>
          <text x="300" y="160" class="label">
              Stars received
          </text>

          <text x="530" y="130" class="number">
              {forks}
          </text>
          <text x="530" y="160" class="label">
              Repository forks
          </text>

          <text x="70" y="240" class="label">
              Profile activity generated automatically
          </text>
          '''

          with open("profile/activity.svg", "w") as f:
              f.write(
                  svg(
                      "📈 GitHub Activity",
                      content
                  )
              )

          # -----------------------------
          # HIGHLIGHTS
          # -----------------------------

          content = f'''
          <text x="70" y="130" class="number">
              {repo_count}
          </text>
          <text x="70" y="160" class="label">
              Repositories
          </text>

          <text x="300" y="130" class="number">
              {followers}
          </text>
          <text x="300" y="160" class="label">
              Followers
          </text>

          <text x="530" y="130" class="number">
              {stars}
          </text>
          <text x="530" y="160" class="label">
              Stars
          </text>

          <text x="730" y="130" class="number">
              {forks}
          </text>
          <text x="730" y="160" class="label">
              Forks
          </text>
          '''

          with open("profile/trophies.svg", "w") as f:
              f.write(
                  svg(
                      "🏆 GitHub Highlights",
                      content
                  )
              )

          print("All SVG files created successfully.")

          PY

      - name: Commit SVG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          git diff --cached --quiet || \
            git commit -m "Update profile statistics"

          git push
```
